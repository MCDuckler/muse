# WetOwl Desk (v2) builds.
# - windows: the booth (egui), zipped with bench.cmd for a tester to run on real hardware
#   (see desk/README.md). No music goes in the zip: the booths play the tester's own
#   fetched records, else synthesised ones.
# - macos: "WetOwl Desk.app" (Apple silicon + Intel, the stage inside it), smoke-tested
#   with its stage, and on pushes to desk published as the rolling release
#   wetowl-desk-macos, which desk/deploy/macos/install.sh fetches (no administrator).
# Runs on pushes to the desk branch that touch desk/, the engine or the Mac runner (or by hand).
name: Desk

on:
  push:
    branches: [desk]
    # (the Rust stage's crates have their own workflow, stage-rust.yml, until the Desk carries the stage)
    paths: ["desk/**", "!desk/crates/wo-shaders/**", "!desk/crates/wo-render/**", "!desk/crates/wo-dance/**", "!desk/crates/wo-milk/**", "!desk/apps/wetowl-stage/**", "app/native/engine/**", "app/native/stage/**", "app/native/milk/**", "app/shaders/**", "app/macos/**", "app/lib/src/ui/show/**", "app/lib/src/state/show/**", ".github/workflows/desk.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - name: Build the Desk
        run: cargo build --release -p wetowl-desk
      - name: Engine and decoder tests
        run: cargo test --release --workspace
      - name: Smoke — the egui booth starts and draws (WARP, no GPU here)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          ./target/release/wetowl-desk.exe --bench 8 --out smoke
          Get-Content smoke/bench-egui-wgpu.json
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/wetowl-desk.exe, bakeoff/bench.cmd pkg/
          Copy-Item design/fonts/OFL-*.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath wetowl-desk-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-desk-windows
          path: |
            desk/wetowl-desk-windows.zip
            desk/smoke/

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      STAGE: app/build/macos/Build/Products/Release/WetOwl.app
      APP: desk/target/macos/WetOwl Desk.app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: MilkDrop's helper for the Mac, and does it draw
        run: |
          # First, before the long build: projectM through CGL (no window), for both
          # chips. On its own it draws projectM's idle preset; a frame must come.
          app/native/milk/build-macos.sh
          mkdir -p smoke
          h=app/native/milk/build-macos/wetowl-milk
          ( sleep 6; printf 'quit\n' ) | "$h" --size 320x180 --fps 30 > smoke/milk-frames.bin 2> smoke/milk.log || true
          cat smoke/milk.log
          ls -l smoke/milk-frames.bin
          [ "$(head -c 4 smoke/milk-frames.bin)" = "MILK" ] || { echo "the helper drew no frame"; exit 1; }
      - name: The stage — the WetOwl app, built from this checkout
        working-directory: app
        run: |
          flutter pub get
          stamp="$(date -u +%Y%m%d%H%M)"
          flutter build macos --release \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER=https://89-58-49-140.nip.io \
            --dart-define=MUSE_BUILD="desk-stage-$stamp"
          # In Resources, not beside the program: see lib/src/worker/build_stamp.dart.
          echo "$stamp" > "../$STAGE/Contents/Resources/build-stamp.txt"
      - name: The Desk, bundled with its stage (and MilkDrop in it)
        run: |
          app/native/milk/build-macos.sh "$PWD/$STAGE"
          desk/deploy/macos/bundle.sh "$PWD/$STAGE"
      - name: Smoke — the Desk opens its stage, and both draw
        timeout-minutes: 4
        run: |
          # As Finder would start it (output not a terminal → its log file), with no
          # sound card or controllers on the runner. The stage must start as a stage
          # (the command line reached Dart: STAGE lines), connect, and draw.
          mkdir -p smoke
          log="$HOME/Library/Logs/WetOwl Desk.log"
          WO_AUDIO=off WO_CONTROLLERS=off "$APP/Contents/MacOS/wetowl-desk" --bench 30 --stage --out "$PWD/smoke" </dev/null >/dev/null 2>&1 &
          desk=$!
          sleep 20
          screencapture -x smoke/mac-screen.png || true
          pgrep -fl 'Helpers/WetOwl.app' || true
          wait $desk || echo "the Desk exited with $?"
          cat "$log"
          ls -l smoke
          cat smoke/bench-egui-wgpu.json
          grep -q 'STAGE fps=' "$log" || { echo "the stage never drew"; exit 1; }
          if grep -q "the Desk's show could not start" "$log"; then exit 1; fi
          echo "Metal shader refusals: $(grep -c 'Impeller validation' "$log" || true)"
      - name: Smoke — every shader scene builds on Metal
        timeout-minutes: 6
        run: |
          # Impeller on Metal gives each uniform a buffer slot and has 31: a shader past
          # that does not build, and its scene draws nothing (the scene .frag files pack
          # their floats into vec4s for this). Each scene alone on the demo record.
          st="$APP/Contents/Helpers/WetOwl.app/Contents/MacOS/WetOwl"
          bad=0
          for sc in kinetic flash blocks fold glide drift echo milk; do
            "$st" --stage --demo --scene "$sc" --shot > "smoke/$sc.log" 2>&1 &
            pid=$!
            sleep 14
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            shot=$(grep -o 'STAGE shot [^ ]*' "smoke/$sc.log" | head -1 | cut -d' ' -f3)
            [ -n "$shot" ] && [ -f "$shot" ] && cp "$shot" "smoke/$sc.png"
            if grep -q 'Impeller validation' "smoke/$sc.log"; then
              echo "$sc: a shader would not build on Metal"
              grep -m2 'Impeller validation' "smoke/$sc.log" | cut -c1-300
              bad=1
            else
              echo "$sc: built (shot: ${shot:-none})"
            fi
            # MilkDrop's scene: its helper started and said ready
            if [ "$sc" = milk ]; then
              grep -E 'milk: ' "smoke/$sc.log" | head -8 || true
              # the helper said its renderer (the context made) and a preset took
              grep -q 'milk: egl cgl' "smoke/$sc.log" || { echo "milk: the helper did not start drawing"; bad=1; }
              grep -q 'milk: preset ok' "smoke/$sc.log" || echo "milk: no preset said ok (yet)"
            fi
          done
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetowl-desk-macos
          path: |
            desk/target/macos/wetowl-desk-macos.zip
            smoke/
      - name: Engine and decoder tests
        working-directory: desk
        run: cargo test --release --workspace
      - name: Published for the installer (rolling release wetowl-desk-macos)
        if: github.event_name == 'push' && github.ref == 'refs/heads/desk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag sits on the default branch: the Actions token may not make a tag on a
          # commit that changes workflow files (desk does), and a rolling release is
          # its asset, not its tag.
          tag=wetowl-desk-macos
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease --latest=false --target "${{ github.event.repository.default_branch }}" \
            --title "WetOwl Desk for Mac (rolling)" \
            --notes "The newest WetOwl Desk for macOS, from the desk branch. Install without an administrator: curl -fsSL https://raw.githubusercontent.com/MCDuckler/muse/desk/desk/deploy/macos/install.sh | bash"
          gh release upload "$tag" desk/target/macos/wetowl-desk-macos.zip --clobber
          gh release edit "$tag" --notes "Build $(cat "$APP/Contents/Resources/build.txt"). The newest WetOwl Desk for macOS, from the desk branch. Install without an administrator, in Terminal: curl -fsSL https://raw.githubusercontent.com/MCDuckler/muse/desk/desk/deploy/macos/install.sh | bash"
