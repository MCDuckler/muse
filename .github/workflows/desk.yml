# WetOwl Desk (v2) builds.
# - windows: the booth (egui) and the Rust stage, zipped with bench.cmd for a tester to run
#   on real hardware (see desk/README.md); on pushes to desk published as the rolling
#   release wetowl-desk-windows. No music goes in the zip: the booths play the tester's
#   own fetched records, else synthesised ones.
# - macos: "WetOwl Desk.app" (Apple silicon + Intel, the stage inside it), smoke-tested
#   with its stage, then unpacked and opened as a portable (a double-click, from a folder
#   nothing writes to; the Intel half through Rosetta), and on pushes to desk published as
#   the rolling release wetowl-desk-macos: a zip that runs wherever it is unpacked, which
#   desk/deploy/macos/install.sh also fetches (no administrator).
# Runs on pushes to the desk branch that touch desk/, the engine or the Mac runner (or by hand).
name: Desk

on:
  push:
    branches: [desk]
    # (the Rust stage's crates have their own workflow, stage-rust.yml, until the Desk carries the stage)
    paths: ["desk/**", "!desk/crates/wo-dance/**", "!desk/crates/wo-milk/**", "app/assets/show/**", "app/native/engine/**", "app/native/stage/**", "app/native/milk/**", "app/shaders/**", "app/macos/**", "app/lib/src/ui/show/**", "app/lib/src/state/show/**", ".github/workflows/desk.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - name: Build the Desk
        run: cargo build --release -p wetowl-desk -p wetowl-stage
      - name: vcpkg's GLEW, kept between runs
        id: vcpkg
        shell: bash
        run: echo "rev=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-x64-windows-${{ steps.vcpkg.outputs.rev }}-glew
      - name: MilkDrop's helper (projectM through WGL), beside the stage
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install glew:x64-windows
          cmake -S ../app/native/milk -B milk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" > /dev/null
          cmake --build milk-build --config Release -j4 > /dev/null
          mkdir -p milk-out
          cp "$(find milk-build -name wetowl-milk.exe | head -1)" milk-out/
          cp "$(find milk-build -name 'projectM-4*.dll' | head -1)" milk-out/
          cp "$(find "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -name 'glew32*.dll' | head -1)" milk-out/
          ls -l milk-out
      - name: Engine and decoder tests
        run: cargo test --release --workspace --no-fail-fast
      - name: Smoke — the egui booth starts and draws (WARP, no GPU here)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          ./target/release/wetowl-desk.exe --bench 8 --out smoke
          Get-Content smoke/bench-egui-wgpu.json
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/wetowl-desk.exe, target/release/wetowl-stage.exe, bakeoff/bench.cmd pkg/
          Copy-Item milk-out/* pkg/
          # the dancers the Rust stage draws
          foreach ($d in Get-ChildItem ../app/assets/show/dance -Directory) {
            New-Item -ItemType Directory -Force "pkg/dance/$($d.Name)" | Out-Null
            Copy-Item "$($d.FullName)/dancer.json", "$($d.FullName)/dancer.bin", "$($d.FullName)/moves.bin", "$($d.FullName)/skin.webp" "pkg/dance/$($d.Name)/"
          }
          Copy-Item design/fonts/OFL-*.txt pkg/
          $build = "$(Get-Date -AsUTC -Format yyyyMMdd-HHmm) $("${{ github.sha }}".Substring(0, 7))"
          Set-Content pkg/build.txt $build
          Set-Content pkg/README.txt @"
          WetOwl Desk for Windows (build $build)

          Run wetowl-desk.exe. Windows may say "Windows protected your PC" (the program is
          not signed): click "More info", then "Run anyway".
          Sign in with your WetOwl account. The stage (the show) opens from the Show page.
          If Windows says VCRUNTIME140.dll is missing, install the Microsoft Visual C++
          Redistributable (x64): https://aka.ms/vs/17/release/vc_redist.x64.exe
          "@
          Compress-Archive -Path pkg/* -DestinationPath wetowl-desk-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-desk-windows
          path: |
            desk/wetowl-desk-windows.zip
            desk/smoke/
      - name: Published for download (rolling release wetowl-desk-windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/desk'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag sits on the default branch, as the Mac's does (see there).
          tag=wetowl-desk-windows
          zip_url="https://github.com/${{ github.repository }}/releases/download/$tag/wetowl-desk-windows.zip"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease --latest=false --target "${{ github.event.repository.default_branch }}" \
            --title "WetOwl Desk for Windows (rolling)" \
            --notes "The newest WetOwl Desk for Windows, from the desk branch."
          gh release upload "$tag" wetowl-desk-windows.zip --clobber
          gh release edit "$tag" --notes "Build $(tr -d '\r' < pkg/build.txt). The newest WetOwl Desk for Windows (the booth and the Rust stage), from the desk branch. Download $zip_url, unzip it anywhere, run wetowl-desk.exe. Windows may say \"Windows protected your PC\" (the program is not signed): More info, then Run anyway."

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      STAGE: app/build/macos/Build/Products/Release/WetOwl.app
      APP: desk/target/macos/WetOwl Desk.app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: MilkDrop's helper for the Mac, and does it draw
        run: |
          # First, before the long build: projectM through CGL (no window), for both
          # chips. On its own it draws projectM's idle preset; a frame must come.
          app/native/milk/build-macos.sh
          mkdir -p smoke
          h=app/native/milk/build-macos/wetowl-milk
          ( sleep 6; printf 'quit\n' ) | "$h" --size 320x180 --fps 30 > smoke/milk-frames.bin 2> smoke/milk.log || true
          cat smoke/milk.log
          ls -l smoke/milk-frames.bin
          [ "$(head -c 4 smoke/milk-frames.bin)" = "MILK" ] || { echo "the helper drew no frame"; exit 1; }
      - name: The stage — the WetOwl app, built from this checkout
        working-directory: app
        run: |
          flutter pub get
          stamp="$(date -u +%Y%m%d%H%M)"
          flutter build macos --release \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER=https://89-58-49-140.nip.io \
            --dart-define=MUSE_BUILD="desk-stage-$stamp"
          # In Resources, not beside the program: see lib/src/worker/build_stamp.dart.
          echo "$stamp" > "../$STAGE/Contents/Resources/build-stamp.txt"
      - name: The Desk, bundled with its stage (and MilkDrop in it)
        run: |
          app/native/milk/build-macos.sh "$PWD/$STAGE"
          desk/deploy/macos/bundle.sh "$PWD/$STAGE"
      - name: Smoke — the Desk opens its stage, and both draw
        timeout-minutes: 4
        run: |
          # As Finder would start it (output not a terminal → its log file), with no
          # sound card or controllers on the runner. The stage must start as a stage
          # (the command line reached Dart: STAGE lines), connect, and draw.
          mkdir -p smoke
          log="$HOME/Library/Logs/WetOwl Desk.log"
          WO_AUDIO=off WO_CONTROLLERS=off "$APP/Contents/MacOS/wetowl-desk" --bench 30 --stage --out "$PWD/smoke" </dev/null >/dev/null 2>&1 &
          desk=$!
          sleep 20
          screencapture -x smoke/mac-screen.png || true
          pgrep -fl 'Helpers/WetOwl.app' || true
          wait $desk || echo "the Desk exited with $?"
          cat "$log"
          ls -l smoke
          cat smoke/bench-egui-wgpu.json
          grep -q 'STAGE fps=' "$log" || { echo "the stage never drew"; exit 1; }
          if grep -q "the Desk's show could not start" "$log"; then exit 1; fi
          echo "Metal shader refusals: $(grep -c 'Impeller validation' "$log" || true)"
      - name: Smoke — the Desk opens the Rust stage, directs it, and it draws
        timeout-minutes: 3
        run: |
          log="$HOME/Library/Logs/WetOwl Desk.log"
          : > "$log"
          WO_STAGE_RUST=1 WO_AUDIO=off WO_CONTROLLERS=off "$APP/Contents/MacOS/wetowl-desk" --bench 20 --stage --out "$PWD/smoke/rust" </dev/null >/dev/null 2>&1 &
          desk=$!
          sleep 14
          screencapture -x smoke/mac-screen-rust.png || true
          wait $desk || echo "the Desk exited with $?"
          grep -E 'STAGE|stage:' "$log" | tail -8
          grep -q 'STAGE fps=' "$log" || { echo "the Rust stage never drew"; exit 1; }
          grep -E 'STAGE fps=' "$log" | grep -q 'cues=[1-9]' || { echo "the Rust stage heard no cue from the Desk"; exit 1; }
      - name: Smoke — MilkDrop on the Rust stage (the bundle's helper)
        timeout-minutes: 3
        run: |
          # 24 s: on the runner the helper draws with Apple's software renderer (a few frames a
          # second, its first after seconds), and the stage builds its pipelines first
          "$APP/Contents/MacOS/wetowl-stage" --scene milk --milk-dir "$PWD/app/assets/milk/presets" --seconds 24 --shot "$PWD/smoke/rust-milk.png" > smoke/rust-milk.log 2>&1 || true
          grep -E 'STAGE|milk|stage:' smoke/rust-milk.log | tail -8
          grep -q 'milk: preset ok' smoke/rust-milk.log || { echo "MilkDrop's helper did not put a preset on"; exit 1; }
          grep -E 'STAGE fps=' smoke/rust-milk.log | grep -qE 'milk=[1-9][0-9]*fps' || { echo "no MilkDrop frames reached the Rust stage"; exit 1; }
      - name: Smoke — every shader scene builds on Metal
        timeout-minutes: 6
        run: |
          # Impeller on Metal gives each uniform a buffer slot and has 31: a shader past
          # that does not build, and its scene draws nothing (the scene .frag files pack
          # their floats into vec4s for this). Each scene alone on the demo record.
          st="$APP/Contents/Helpers/WetOwl.app/Contents/MacOS/WetOwl"
          bad=0
          for sc in kinetic flash blocks fold glide drift echo milk; do
            "$st" --stage --demo --scene "$sc" --shot > "smoke/$sc.log" 2>&1 &
            pid=$!
            sleep 14
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            shot=$(grep -o 'STAGE shot [^ ]*' "smoke/$sc.log" | head -1 | cut -d' ' -f3)
            [ -n "$shot" ] && [ -f "$shot" ] && cp "$shot" "smoke/$sc.png"
            if grep -q 'Impeller validation' "smoke/$sc.log"; then
              echo "$sc: a shader would not build on Metal"
              grep -m2 'Impeller validation' "smoke/$sc.log" | cut -c1-300
              bad=1
            else
              echo "$sc: built (shot: ${shot:-none})"
            fi
            # MilkDrop's scene: its helper started and said ready
            if [ "$sc" = milk ]; then
              grep -E 'milk: ' "smoke/$sc.log" | head -8 || true
              # the helper said its renderer (the context made) and a preset took
              grep -q 'milk: egl cgl' "smoke/$sc.log" || { echo "milk: the helper did not start drawing"; bad=1; }
              grep -q 'milk: preset ok' "smoke/$sc.log" || echo "milk: no preset said ok (yet)"
            fi
          done
          exit $bad
      - name: Portable — the download unpacked anywhere, opened as a double-click opens it
        timeout-minutes: 6
        run: |
          # What a Mac user does without installing: the zip a browser fetched (marked as a
          # download; unpacking carries the mark onto every file) unpacked into some
          # folder, the mark cleared as READ ME FIRST.txt says, the app opened through
          # Launch Services as Finder opens it (no terminal, no environment) from a folder
          # nothing may write to (like a translocated app or a locked stick).
          p="$RUNNER_TEMP/Some folder"
          rm -rf "$p"
          mkdir -p "$p"
          cp desk/target/macos/wetowl-desk-macos.zip "$p/"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$p/wetowl-desk-macos.zip"
          ditto -x -k "$p/wetowl-desk-macos.zip" "$p"
          app="$p/WetOwl Desk/WetOwl Desk.app"
          [ -d "$app" ] && [ -f "$p/WetOwl Desk/READ ME FIRST.txt" ] || { echo "the zip is not the portable folder"; ls -la "$p" "$p"/*; exit 1; }
          cat "$p/WetOwl Desk/READ ME FIRST.txt"
          echo "mark: $(xattr -p com.apple.quarantine "$app/Contents/MacOS/wetowl-desk" 2>&1)"
          spctl --assess --type execute -vv "$app" 2>&1 || echo "(Gatekeeper refuses it while marked, as READ ME FIRST.txt says)"
          xattr -dr com.apple.quarantine "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/wetowl-desk"
          lipo -archs "$app/Contents/MacOS/wetowl-stage"
          chmod -R a-w "$p"
          log="$HOME/Library/Logs/WetOwl Desk.log"
          mine="Some folder/WetOwl Desk/WetOwl Desk.app/Contents/MacOS/wetowl-desk"
          # once with the stage it carries (the WetOwl app), once with the Rust stage
          for run in stage rust; do
            : > "$log"
            out="$RUNNER_TEMP/portable-$run"
            mkdir -p "$out"
            if [ "$run" = rust ]; then
              open -n --env WO_STAGE_RUST=1 "$app" --args --bench 16 --stage --out "$out" \
                || { launchctl setenv WO_STAGE_RUST 1; open -n "$app" --args --bench 16 --stage --out "$out"; }
            else
              open -n "$app" --args --bench 16 --stage --out "$out"
            fi
            sleep 12
            screencapture -x "smoke/mac-portable-$run.png" || true
            pgrep -fl "$mine" || { echo "$run: no Desk runs from the portable folder"; cat "$log"; exit 1; }
            for _ in $(seq 30); do pgrep -f "$mine" >/dev/null || break; sleep 1; done
            pkill -f "$mine" || true
            pkill -f "Some folder/WetOwl Desk" || true
            echo "---- $run: the Desk's log"
            grep -vE '^\s*$' "$log" | tail -25
            grep -q -- '---- WetOwl Desk' "$log" || { echo "$run: the Desk did not start"; exit 1; }
            grep -q 'STAGE fps=' "$log" || { echo "$run: the stage never drew"; exit 1; }
            if grep -q "the Desk's show could not start" "$log"; then exit 1; fi
            [ -s "$out/bench-egui-wgpu.json" ] || { echo "$run: the Desk never finished its bench (no report)"; exit 1; }
            cp "$out/bench-egui-wgpu.json" "smoke/portable-$run-bench.json"
          done
          grep -E 'STAGE fps=' "$log" | grep -q 'cues=[1-9]' || { echo "the portable Rust stage heard no cue from the Desk"; exit 1; }
      - name: Portable — the Intel half, through Rosetta
        timeout-minutes: 4
        run: |
          # The x86_64 half of each program is built here but never runs on an Apple chip;
          # Rosetta runs it as an Intel Mac would (the same GPU under it).
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          app="$RUNNER_TEMP/Some folder/WetOwl Desk/WetOwl Desk.app"
          arch -x86_64 "$app/Contents/MacOS/wetowl-stage" --scene dance-art --seconds 12 --shot "$PWD/smoke/intel-dance.png" > smoke/intel-stage.log 2>&1 || true
          grep -E 'STAGE|stage:|dance' smoke/intel-stage.log | tail -6
          grep -q 'STAGE fps=' smoke/intel-stage.log || { echo "the Intel stage never drew"; cat smoke/intel-stage.log; exit 1; }
          log="$HOME/Library/Logs/WetOwl Desk.log"
          : > "$log"
          arch -x86_64 "$app/Contents/MacOS/wetowl-desk" --bench 10 --out "$RUNNER_TEMP/intel" </dev/null >/dev/null 2>&1 || echo "the Desk exited with $?"
          tail -12 "$log"
          [ -s "$RUNNER_TEMP/intel/bench-egui-wgpu.json" ] || { echo "the Intel Desk never finished its bench"; exit 1; }
          cat "$RUNNER_TEMP/intel/bench-egui-wgpu.json"
          launchctl unsetenv WO_STAGE_RUST || true
          chmod -R u+w "$RUNNER_TEMP/Some folder"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetowl-desk-macos
          path: |
            desk/target/macos/wetowl-desk-macos.zip
            smoke/
      - name: Engine and decoder tests
        working-directory: desk
        run: cargo test --release --workspace --no-fail-fast
      - name: Published for the installer (rolling release wetowl-desk-macos)
        if: github.event_name == 'push' && github.ref == 'refs/heads/desk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag sits on the default branch: the Actions token may not make a tag on a
          # commit that changes workflow files (desk does), and a rolling release is
          # its asset, not its tag.
          tag=wetowl-desk-macos
          zip_url="https://github.com/${{ github.repository }}/releases/download/$tag/wetowl-desk-macos.zip"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease --latest=false --target "${{ github.event.repository.default_branch }}" \
            --title "WetOwl Desk for Mac (rolling)" \
            --notes "The newest WetOwl Desk for macOS, from the desk branch."
          gh release upload "$tag" desk/target/macos/wetowl-desk-macos.zip --clobber
          cat > notes.md <<NOTES
          Build $(cat "$APP/Contents/Resources/build.txt"). The newest WetOwl Desk for macOS (the booth, its stage, MilkDrop), from the desk branch. Apple silicon and Intel, macOS 11 or newer.

          **Portable, nothing to install:** download $zip_url, unzip it anywhere, open the folder *WetOwl Desk* and double-click *WetOwl Desk.app*. The app is not signed with a paid Apple account, so the first time macOS stops it: click Done, then System Settings › Privacy & Security › *Open Anyway* — or, with no password, in Terminal: \`xattr -dr com.apple.quarantine\` + the app dragged in. *READ ME FIRST.txt* in the folder says the same.

          **Portable from Terminal (no Gatekeeper step; lands in your home folder):** \`cd ~ && curl -fL $zip_url -o wetowl-desk.zip && ditto -x -k wetowl-desk.zip . && rm wetowl-desk.zip && open "WetOwl Desk/WetOwl Desk.app"\`

          **Installed into ~/Applications** (no administrator; run again to update): \`curl -fsSL https://raw.githubusercontent.com/MCDuckler/muse/desk/desk/deploy/macos/install.sh | bash\`
          NOTES
          gh release edit "$tag" --notes-file notes.md
