# WetOwl Desk (v2) Windows build: the booth (egui), zipped with bench.cmd for a tester
# to run on real hardware (see desk/README.md). Runs on
# pushes to the desk branch that touch desk/ (or by hand). No music goes in the zip:
# the booths play the tester's own fetched records, else synthesised ones.
name: Desk

on:
  push:
    branches: [desk]
    paths: ["desk/**", "app/native/engine/**", ".github/workflows/desk-bakeoff.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - name: Build the Desk
        run: cargo build --release -p wetowl-desk
      - name: Engine and decoder tests
        run: cargo test --release --workspace
      - name: Smoke — the egui booth starts and draws (WARP, no GPU here)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          ./target/release/wetowl-desk.exe --bench 8 --out smoke
          Get-Content smoke/bench-egui-wgpu.json
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/wetowl-desk.exe, bakeoff/bench.cmd pkg/
          Copy-Item design/fonts/OFL-*.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath wetowl-desk-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-desk-windows
          path: |
            desk/wetowl-desk-windows.zip
            desk/smoke/
