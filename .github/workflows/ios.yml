# Build the iPhone app.
#
# iOS binaries can only be produced on macOS — Flutter's build shells out to xcodebuild
# and the asset-catalog tools, which do not exist anywhere else — and the only macOS
# machine involved in this project is a rented one for ten minutes at a time. That is
# what this is.
#
# It builds *unsigned*, which is the useful part: SideStore signs the app on the phone
# with your own Apple ID, so no certificates, no provisioning profiles and no Apple
# credentials go anywhere near this workflow. There is nothing here to leak.
name: iPhone app

on:
  # Every push that touches the app, and on demand from the Actions tab.
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'muse server the build points at'
        default: 'https://89-58-49-140.nip.io'

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    # The one permission this needs: attaching the ipa to a release. A repository's
    # token is read-only by default, which is the right default and the reason the
    # first run built the app and then could not hand it over.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      - name: Check it compiles cleanly
        working-directory: app
        run: flutter analyze lib

      - name: Run the tests
        working-directory: app
        run: flutter test

      - name: Build, unsigned
        working-directory: app
        env:
          MUSE_SERVER: ${{ inputs.server || 'https://89-58-49-140.nip.io' }}
        run: |
          # The same stamp the Android build carries: the moment it was built, which
          # is the only thing that tells one of these apart from another on a phone.
          # Without it the iPhone app has no version at all to report.
          #
          # It is also the bundle's build number. Left unset, Flutter copies the pubspec
          # version into CFBundleVersion, so every build claimed to be 0.1.0 and
          # SideStore could neither match the ipa to its source nor see a newer one.
          stamp="$(date -u +%Y%m%d%H%M)"
          flutter build ios --release --no-codesign \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER="$MUSE_SERVER" \
            --dart-define=MUSE_BUILD="$stamp"

      - name: Wrap it as an ipa
        working-directory: app
        run: |
          # An ipa is a zip with the app inside a folder called Payload. That is the
          # whole format; the signing SideStore does happens on the phone.
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry wetowl.ipa Payload
          ls -lh wetowl.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-ipa
          path: app/build/ipa/wetowl.ipa
          retention-days: 30

      # A release makes it a plain link the phone can open, which is easier than
      # digging an artifact out of the Actions tab on a small screen.
      - name: Publish it as a release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ios-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" app/build/ipa/wetowl.ipa \
            --title "WetOwl for iPhone · $tag" \
            --notes "Unsigned build of ${{ github.sha }}. Open it with SideStore."
