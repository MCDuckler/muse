# The Rust stage (plan: ~/.claude/plans/wetowl-stage-rust.md), on all three desktops:
# the show's shaders fitted and checked (wo-shaders), then drawn headless on each GPU API
# — Vulkan (Linux, Mesa's software lavapipe on the runner), Direct3D 12 (Windows, WARP),
# Metal (macOS) — and the pictures kept, a sheet per OS.
name: Stage (Rust)

on:
  push:
    branches: [desk]
    paths: ["desk/crates/wo-shaders/**", "desk/crates/wo-render/**", "desk/crates/wo-dance/**", "desk/crates/wo-milk/**", "desk/crates/wo-show/**", "app/assets/show/scenes/**", "desk/apps/wetowl-stage/**", "desk/crates/wo-wire/**", "desk/crates/wo-deskcore/**", "app/native/milk/**", "app/assets/milk/**", "app/assets/show/combo_scores.json", "app/shaders/**", "app/assets/show/dance/**", ".github/workflows/stage-rust.yml"]
  workflow_dispatch:

jobs:
  draw:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
          key: stage-rust
      - name: "A Vulkan driver (Linux: Mesa's lavapipe, on the CPU)"
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb libxkbcommon-x11-0 libasound2-dev libudev-dev libegl-dev libgl-dev libglvnd-dev
      - name: The shaders fitted, read and written for Metal, Direct3D and Vulkan
        run: cargo test --release -p wo-shaders
      - name: The show's rules (wo-show), v1's tests among them; the wire
        run: cargo test --release -p wo-show -p wo-wire -p wetowl-stage
      - name: The scenes drawn on this GPU API
        env:
          # Windows: Direct3D 12 (WARP on the runner); elsewhere the platform's own
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || (runner.os == 'macOS' && 'metal' || 'vulkan') }}
        run: cargo run --release -p wo-render --example scene_shots -- "$GITHUB_WORKSPACE/shots-${{ runner.os }}"
      - name: The stage's whole frame against its goldens (every drawn scene, the blends)
        env:
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || (runner.os == 'macOS' && 'metal' || 'vulkan') }}
          WO_NEED_GPU: "1"
          WO_SHOTS: ${{ github.workspace }}/shots-${{ runner.os }}/stage
        run: cargo test --release -p wo-render -- --nocapture
      - name: A dancer read, posed and drawn on this GPU API
        env:
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || (runner.os == 'macOS' && 'metal' || 'vulkan') }}
        run: |
          cargo test --release -p wo-dance
          cargo run --release -p wo-dance --example dancer_shot -- ../app/assets/show/dance/chris long22 "$GITHUB_WORKSPACE/shots-${{ runner.os }}/dancer.png"
      - name: The stage window, full screen on a screen chosen by name
        env:
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || (runner.os == 'macOS' && 'metal' || 'vulkan') }}
        run: |
          # Linux: X11 under Xvfb (Wayland is checked on the dev box, headless mutter with
          # two screens); Windows and macOS: the runner's own desktop.
          cargo build --release -p wetowl-stage
          bin=target/release/wetowl-stage
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1920x1080x24" "$bin" "$@"; else "$bin" "$@"; fi; }
          run --list-screens | tee screens.txt
          screen=$(head -1 screens.txt | sed -E 's/^SCREEN (.*) [0-9]+x[0-9]+$/\1/')
          run --scene blocks --screen "$screen" --seconds 6 | tee stage.txt
          grep -qF "screen=$screen full=1" stage.txt || { echo "not full screen on $screen"; exit 1; }
      - name: MilkDrop's helper, kept between runs (projectM patched, built once)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: app/native/milk/build
          key: milk-linux-${{ hashFiles('app/native/milk/**') }}
      - name: MilkDrop's helper (Linux, EGL with no window)
        if: runner.os == 'Linux'
        working-directory: app/native/milk
        run: |
          [ -x build/wetowl-milk ] || { cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build build -j4 > /dev/null; }
          ls -l build/wetowl-milk
      - name: The Desk directs the Rust stage, MilkDrop too (Linux, X11 under Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          cargo build --release -p wetowl-stage
          WETOWL_MILK="$GITHUB_WORKSPACE/app/native/milk/build/wetowl-milk" \
          WGPU_BACKEND=vulkan WO_STAGE_RUST="$PWD/target/release/wetowl-stage" xvfb-run -a -s "-screen 0 1920x1080x24" \
            cargo test --release -p wo-deskcore --test stage_rust_live -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-shots-${{ runner.os }}
          path: shots-${{ runner.os }}/
          retention-days: 14
