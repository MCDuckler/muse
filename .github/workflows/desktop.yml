# Build the desktop app: Windows, Linux and macOS.
#
# A Windows binary can only be produced on Windows — Flutter's build shells out to
# Visual Studio's compiler — and there is no Windows machine in this project, so it is a
# rented one for ten minutes at a time, the same way the iPhone build is. Linux is built
# here too rather than on the laptop it is developed on: that laptop runs a rolling
# distribution, and a binary linked against this month's glibc does not start on
# anybody's Ubuntu LTS. Built on the oldest supported Ubuntu, it starts everywhere newer.
#
# A Mac binary likewise needs a Mac — Xcode — and gets a rented one. It is built
# universal (Apple silicon and Intel) where Flutter can, which is the app; the three
# windowless programs beside it are plain Dart, which builds only for the machine it
# runs on, so an Intel Mac builds those too and both go in the bundle, side by side
# (see programFile in app/lib/src/worker/build_stamp.dart).
#
# On demand only, like the iPhone build, and for the same reason. `platforms` builds
# only some of them (a comma list: windows,linux,macos) while one is being worked on;
# a release is only made of all three.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'muse server the build points at'
        default: 'https://89-58-49-140.nip.io'
      platforms:
        description: 'which to build: all, or a comma list of windows,linux,macos'
        default: 'all'

jobs:
  windows:
    if: inputs.platforms == 'all' || inputs.platforms == '' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: Build
        working-directory: app
        shell: bash
        env:
          MUSE_SERVER: ${{ inputs.server || 'https://89-58-49-140.nip.io' }}
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          echo "$stamp" > build-stamp.txt
          flutter build windows --release \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER="$MUSE_SERVER" \
            --dart-define=MUSE_BUILD="$stamp"
      - name: A whole libmpv
        working-directory: app
        shell: bash
        run: |
          # media_kit's own Windows libmpv is built small: no lavfi shelf or pass filters,
          # which the booth's EQ and filter are made of — turning a knob dropped the sound
          # — and no Rubber Band, so a synced deck ran on mpv's own stretcher, which moves
          # beats by up to 17 ms and was heard as a stutter. shinchiro's build has both
          # (a GPL build, as Rubber Band requires). Pinned, and checked, so a build is
          # the same build next week.
          url=https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260924/mpv-dev-x86_64-20260924-git-2a4eb8067c.7z
          curl -fsSL -o mpv-dev.7z "$url"
          echo "50caf10ddb6644da4c205ce67dfe37e32fc3715b33c82e933d6e1962ff61eac9  mpv-dev.7z" | sha256sum -c -
          7z x -y -ompv-dev mpv-dev.7z libmpv-2.dll > /dev/null
          echo "d2d081547efea8a1530f4ba0bf58a0d72069b25c40d8b2a7071cea5aa82381c6  mpv-dev/libmpv-2.dll" | sha256sum -c -
          cp mpv-dev/libmpv-2.dll build/windows/x64/runner/Release/libmpv-2.dll
          ls -l build/windows/x64/runner/Release/libmpv-2.dll
      - name: Build the windowless fetcher
        working-directory: app
        shell: bash
        run: |
          # bin/wetowl_fetch.dart: the downloader with no window, which the app starts
          # when asked to keep fetching after it is shut. It goes beside wetowl.exe,
          # which is where the app looks for it. `dart build` rather than `dart compile`
          # because a package in the tree has build hooks and compile refuses those.
          dart build cli --target bin/wetowl_fetch.dart -o build/fetcher
          cp build/fetcher/bundle/bin/wetowl_fetch.exe \
             build/windows/x64/runner/Release/wetowl-fetch.exe
          ls -l build/windows/x64/runner/Release/wetowl-fetch.exe
      - name: Build the separator
        working-directory: app
        shell: bash
        run: |
          # bin/wetowl_separate.dart: takes a record apart with the trained network, in a
          # process of its own. Beside wetowl.exe, where the app looks for it. The network
          # and ONNX Runtime are not in the box: the app fetches them from the house the
          # first time (lib/src/worker/separation_kit.dart).
          dart build cli --target bin/wetowl_separate.dart -o build/separator
          cp build/separator/bundle/bin/wetowl_separate.exe \
             build/windows/x64/runner/Release/wetowl-separate.exe
          said="$(build/windows/x64/runner/Release/wetowl-separate.exe 2>&1 || true)"
          echo "$said" | grep -q 'usage: wetowl-separate'
      - name: Build the updater
        working-directory: app
        shell: bash
        run: |
          # bin/wetowl_update.dart: puts a new build where the old one is, once the old
          # one has shut. It ships beside wetowl.exe and is run out of the *unpacked new
          # build*, never out of the install, so it is never replacing itself.
          #
          # This used to be a script the app wrote into AppData and started detached: a
          # .cmd, then a .ps1. Neither worked on Windows and the second failed silently
          # — the window went, came back, and was the same build. A program can be run
          # and tested where it is written; app/test/update_helper_test.dart does the
          # whole swap for real, which is why this one is trusted.
          dart build cli --target bin/wetowl_update.dart -o build/updater
          cp build/updater/bundle/bin/wetowl_update.exe \
             build/windows/x64/runner/Release/wetowl-update.exe
          said="$(build/windows/x64/runner/Release/wetowl-update.exe 2>&1 || true)"
          echo "$said" | grep -q 'usage: wetowl-update'
      - name: Zip it
        working-directory: app
        shell: pwsh
        run: |
          # Everything the exe needs is beside it — the engine, the plugins, libmpv, the
          # assets — so the folder is the program: unzip it anywhere and run wetowl.exe.
          $out = "build\windows\x64\runner\Release"
          Copy-Item build-stamp.txt "$out\build-stamp.txt"
          Compress-Archive -Path "$out\*" -DestinationPath wetowl-windows.zip
          Get-Item wetowl-windows.zip | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-windows
          path: app/wetowl-windows.zip
          retention-days: 30

  linux:
    if: inputs.platforms == 'all' || inputs.platforms == '' || contains(inputs.platforms, 'linux')
    # The oldest Ubuntu GitHub still runs: see the note at the top.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: What the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: Check it compiles cleanly
        working-directory: app
        run: flutter analyze lib bin
      - name: Run the tests
        working-directory: app
        run: flutter test
      - name: Build
        working-directory: app
        env:
          MUSE_SERVER: ${{ inputs.server || 'https://89-58-49-140.nip.io' }}
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          flutter build linux --release \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER="$MUSE_SERVER" \
            --dart-define=MUSE_BUILD="$stamp"
          echo "$stamp" > build/linux/x64/release/bundle/build-stamp.txt
      - name: Build the windowless fetcher
        working-directory: app
        run: |
          # See the same step for Windows. Beside ./wetowl, where the app looks for it.
          dart build cli --target bin/wetowl_fetch.dart -o build/fetcher
          cp build/fetcher/bundle/bin/wetowl_fetch build/linux/x64/release/bundle/wetowl-fetch
          chmod +x build/linux/x64/release/bundle/wetowl-fetch
          # It has to start and say what it wants, or it is not worth shipping.
          said="$(build/linux/x64/release/bundle/wetowl-fetch 2>&1 || true)"
          echo "$said" | grep -q 'usage: wetowl-fetch'
      - name: Build the separator
        working-directory: app
        run: |
          # See the same step for Windows.
          dart build cli --target bin/wetowl_separate.dart -o build/separator
          cp build/separator/bundle/bin/wetowl_separate build/linux/x64/release/bundle/wetowl-separate
          chmod +x build/linux/x64/release/bundle/wetowl-separate
          said="$(build/linux/x64/release/bundle/wetowl-separate 2>&1 || true)"
          echo "$said" | grep -q 'usage: wetowl-separate'
      - name: Build the updater
        working-directory: app
        run: |
          # See the same step for Windows. Beside ./wetowl, where the app looks for it.
          dart build cli --target bin/wetowl_update.dart -o build/updater
          cp build/updater/bundle/bin/wetowl_update build/linux/x64/release/bundle/wetowl-update
          chmod +x build/linux/x64/release/bundle/wetowl-update
          said="$(build/linux/x64/release/bundle/wetowl-update 2>&1 || true)"
          echo "$said" | grep -q 'usage: wetowl-update'
      - name: Pack it
        working-directory: app
        run: |
          # The sound comes from the system's libmpv, which is not in the box: on Linux
          # it belongs to the distribution. The app says so in its window if it is
          # missing. See README-linux.txt, which goes in with it.
          cat > build/linux/x64/release/bundle/README-linux.txt <<'TXT'
          WetOwl for Linux

          Run ./wetowl

          It plays through libmpv, which your distribution provides:
            Arch / CachyOS / Manjaro:   sudo pacman -S mpv
            Debian / Ubuntu / Mint:     sudo apt install libmpv2      (libmpv1 on older releases)
            Fedora:                     sudo dnf install mpv-libs

          Without it the app opens and says so, and makes no sound.

          Fetching music for the house (Settings > This computer) also wants
          yt-dlp, ffmpeg and nodejs (or deno): all three are ordinary packages.
          ./wetowl-fetch is the part that keeps fetching when the window is shut;
          the app starts it, there is no need to run it yourself. ./wetowl-update
          is the part that puts a new build in once you have shut this one; likewise.

          ./wetowl-separate takes records apart for the booth (drums, music, no
          voice, the voice alone). The app starts it too. The first time, it fetches the network it
          runs (about 50 MB) from your WetOwl server.
          TXT
          mv build/linux/x64/release/bundle build/linux/x64/release/wetowl
          tar -C build/linux/x64/release -czf wetowl-linux.tar.gz wetowl
          ls -lh wetowl-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-linux
          path: app/wetowl-linux.tar.gz
          retention-days: 30

  macos-intel-helpers:
    if: inputs.platforms == 'all' || inputs.platforms == '' || contains(inputs.platforms, 'macos')
    # wetowl-fetch, wetowl-separate and wetowl-update for an Intel Mac: see the note at
    # the top. Put in the bundle beside the Apple silicon ones by the macos job.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: Build them
        working-directory: app
        run: |
          mkdir -p ../intel
          for p in fetch separate update; do
            dart build cli --target bin/wetowl_$p.dart -o build/$p
            cp build/$p/bundle/bin/wetowl_$p ../intel/wetowl-$p-x86_64
            lipo -archs ../intel/wetowl-$p-x86_64
            said="$(../intel/wetowl-$p-x86_64 2>&1 || true)"
            echo "$said" | head -3
            echo "$said" | grep -q "usage: wetowl-$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: intel-helpers
          path: intel/
          retention-days: 3

  macos:
    if: inputs.platforms == 'all' || inputs.platforms == '' || contains(inputs.platforms, 'macos')
    needs: macos-intel-helpers
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP: app/build/macos/Build/Products/Release/WetOwl.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: Build
        working-directory: app
        env:
          MUSE_SERVER: ${{ inputs.server || 'https://89-58-49-140.nip.io' }}
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          echo "$stamp" > build-stamp.txt
          flutter build macos --release \
            --build-number="$stamp" \
            --dart-define=MUSE_SERVER="$MUSE_SERVER" \
            --dart-define=MUSE_BUILD="$stamp"
          # In Resources, not beside the program: see lib/src/worker/build_stamp.dart.
          cp build-stamp.txt "../$APP/Contents/Resources/build-stamp.txt"
          lipo -archs "../$APP/Contents/MacOS/WetOwl"
      - uses: actions/download-artifact@v4
        with:
          name: intel-helpers
          path: intel
      - name: The three programs beside it
        working-directory: app
        run: |
          # Apple silicon here, Intel from the other job — where the app looks for
          # them, in Contents/MacOS beside itself. Two files, not one joined with lipo:
          # a Dart program finds the code it carries by reading its own file, and in a
          # file holding two it reads the wrong one. And each has to start and say what
          # it wants, or it is not worth shipping.
          for p in fetch separate update; do
            dart build cli --target bin/wetowl_$p.dart -o build/$p
            cp build/$p/bundle/bin/wetowl_$p "../$APP/Contents/MacOS/wetowl-$p"
            cp ../intel/wetowl-$p-x86_64 "../$APP/Contents/MacOS/wetowl-$p-x86_64"
            chmod +x "../$APP/Contents/MacOS/wetowl-$p" "../$APP/Contents/MacOS/wetowl-$p-x86_64"
            lipo -archs "../$APP/Contents/MacOS/wetowl-$p"
            said="$("../$APP/Contents/MacOS/wetowl-$p" 2>&1 || true)"
            echo "$said" | head -3
            echo "$said" | grep -q "usage: wetowl-$p"
          done
          ls -l "../$APP/Contents/MacOS"
      - name: Sign it
        run: |
          # Signed ad hoc — by no one, which is what a build without a paid Apple
          # developer account can be. Apple silicon runs nothing unsigned at all, and a
          # bundle whose seal does not match its contents is one macOS calls damaged:
          # the programs added after Xcode signed it are signed first, then the bundle
          # around them. The first open of a download is still refused until it is
          # allowed (see the disk image's note); after that it opens like any app.
          for p in fetch separate update; do
            codesign --force --sign - --identifier io.wetowl.$p "$APP/Contents/MacOS/wetowl-$p"
            codesign --force --sign - --identifier io.wetowl.$p "$APP/Contents/MacOS/wetowl-$p-x86_64"
          done
          codesign --force --sign - --entitlements app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -8
      - name: What a Mac needs, to check it
        run: |
          # ffmpeg for the separator's check below — from Homebrew, as the app tells
          # people to get it.
          brew install ffmpeg
      - name: It opens
        run: |
          # Opened the way a person opens it, left for half a minute, and looked at: a
          # window, the engine loaded, nothing fallen over.
          open "$APP"
          sleep 30
          # The helpers still run once signed: a signature that does not hold is a
          # program the system kills on the spot.
          "$APP/Contents/MacOS/wetowl-update" 2>&1 | grep -q 'usage: wetowl-update'
          pgrep -x WetOwl
          screencapture -x wetowl-macos-open.png || true
          log="$HOME/Library/Application Support/io.wetowl.muse/wetowl.log"
          cat "$log" || true
          grep -q 'desktop audio ready (libmpv)' "$log"
          # Quit as ⌘Q quits. Flutter answers the first ask with "not yet" while it asks
          # the app (osascript calls that "User canceled"), then quits by itself.
          osascript -e 'quit app "WetOwl"' || true
          for i in $(seq 20); do pgrep -x WetOwl >/dev/null || break; sleep 0.5; done
          if pgrep -x WetOwl >/dev/null; then echo "it would not quit"; pkill -x WetOwl; exit 1; fi
      - name: It takes a record apart
        env:
          HOUSE: ${{ inputs.server || 'https://89-58-49-140.nip.io' }}
        run: |
          # The separator with what the app fetches for it the first time — the network
          # and ONNX Runtime from the house, checked against the hashes the app carries
          # — on twenty seconds of noise and a hum.
          mkdir -p kit
          kit=app/lib/src/worker/separation_kit.dart
          sha() { grep -A1 "'$1'" $kit | grep -o "'[0-9a-f]\{64\}'" | tr -d "'"; }
          want() {
            curl -fsSL "$HOUSE/models/$1.gz" | gunzip > "kit/$1"
            echo "$(sha "$1")  kit/$1" | shasum -a 256 -c -
          }
          want scnet-small-v1.onnx
          want onnxruntime-1.30.0-macos-arm64.dylib
          ffmpeg -loglevel error -f lavfi -i "anoisesrc=d=20:a=0.2" -f lavfi -i "sine=f=60:d=20" \
            -filter_complex amix=inputs=2 -ac 2 -ar 44100 test.wav
          time "$APP/Contents/MacOS/wetowl-separate" \
            --ort kit/onnxruntime-1.30.0-macos-arm64.dylib --model kit/scnet-small-v1.onnx \
            --ffmpeg "$(command -v ffmpeg)" --in test.wav --threads 3 \
            --drums drums.m4a --music music.m4a --instrumental instrumental.m4a
          for f in drums music instrumental; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 $f.m4a
          done
      - name: The engine takes the booth's chains
        working-directory: app
        run: flutter test integration_test/desk_engine_test.dart -d macos
      - name: The Mac's own tests
        working-directory: app
        run: flutter test test/update_bundle_test.dart test/background_fetcher_test.dart
      - name: Pack it
        run: |
          # A zip of the bundle, which the app updates itself from — made by ditto, which
          # keeps the links inside the frameworks and the signatures as they are — and a
          # disk image of it with a shortcut to Applications, which is what a person
          # downloads.
          ditto -c -k --sequesterRsrc --keepParent "$APP" wetowl-macos.zip
          mkdir -p dmg
          ditto "$APP" dmg/WetOwl.app
          ln -s /Applications dmg/Applications
          cp app/macos/READ-ME-FIRST.txt "dmg/Read me first.txt"
          hdiutil create -volname WetOwl -srcfolder dmg -ov -format UDZO wetowl-macos.dmg
          ls -lh wetowl-macos.zip wetowl-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: wetowl-macos
          path: |
            wetowl-macos.zip
            wetowl-macos.dmg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-checks
          path: wetowl-macos-open.png
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (inputs.platforms == 'all' || inputs.platforms == '')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: wetowl-*
          merge-multiple: true
      - name: Publish them as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="desktop-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" out/wetowl-windows.zip out/wetowl-linux.tar.gz \
            out/wetowl-macos.dmg out/wetowl-macos.zip \
            --title "WetOwl for Windows, Linux and Mac · $tag" \
            --notes "Build of ${{ github.sha }}. Windows: unzip and run wetowl.exe. Linux: unpack and run ./wetowl (needs libmpv — see README-linux.txt). Mac: open wetowl-macos.dmg and drag WetOwl to Applications; the first open has to be allowed in System Settings › Privacy & Security (see its Read me first). The zip is what the Mac app updates itself from."
