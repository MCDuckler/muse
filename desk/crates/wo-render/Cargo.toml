[package]
name = "wo-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The stage's renderer on wgpu (Vulkan, Direct3D 12, Metal): the show's passes from wo-shaders"

[dependencies]
wgpu = { version = "30.0.1", features = ["naga-ir"] }
wo-shaders = { path = "../wo-shaders" }
wo-show = { path = "../wo-show" }
wo-dance = { path = "../wo-dance" }
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1.0.154"
