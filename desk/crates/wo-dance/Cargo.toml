[package]
name = "wo-dance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The dancers for the Rust stage: scanned bodies, their skeleton, the mocap moves sampled on the beat (no GPU, no I/O but loading)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
wo-show = { path = "../wo-show" }
