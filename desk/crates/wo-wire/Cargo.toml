[package]
name = "wo-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ShowWire: the show between the Desk and a Stage — JSON lines over a WebSocket, the stage's picture back"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
