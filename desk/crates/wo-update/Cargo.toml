[package]
name = "wo-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Desk keeping itself up to date: the newest build of its rolling release fetched, checked and put in place at the next start"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", features = ["json"] }
