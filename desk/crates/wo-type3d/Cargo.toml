[package]
name = "wo-type3d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The 3D text for the Rust stage: a line set in its face and made a distance field, and the numbers type3d.frag ray-marches it by every frame (no GPU)"

[dependencies]
ab_glyph = "0.2.32"
wo-show = { path = "../wo-show" }
wo-dance = { path = "../wo-dance" }

[dev-dependencies]
wo-render = { path = "../wo-render" }
wgpu = "30.0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
