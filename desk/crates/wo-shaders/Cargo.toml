[package]
name = "wo-shaders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The show's .frag files (app/shaders/show) fitted for wgpu: one uniform block, samplers split, checked through naga"

[dependencies]
# wgsl-in too: naga 30 gates the GLSL front end's interpolation defaults on spv-in or wgsl-in
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "msl-out", "hlsl-out", "spv-out", "wgsl-out"] }
