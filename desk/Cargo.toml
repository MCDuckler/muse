# WetOwl Desk: the native desktop app (v2). See ~/.claude/plans/wetowl-v2.md §10 and README.md.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"  # Rubber Band (in the engine) is GPL
publish = false

[workspace.dependencies]
wo-engine-sys = { path = "crates/wo-engine-sys" }
wo-engine = { path = "crates/wo-engine" }
wo-decode = { path = "crates/wo-decode" }
wo-wave = { path = "crates/wo-wave" }
wo-deskcore = { path = "crates/wo-deskcore" }
wo-booth = { path = "crates/wo-booth" }

# Decoding and resampling are far too slow unoptimised; a debug build of the app
# still plays records in real time.
[profile.dev.package."*"]
opt-level = 2
