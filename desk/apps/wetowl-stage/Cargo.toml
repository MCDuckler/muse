[package]
name = "wetowl-stage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WetOwl's stage in Rust: the show in a window of its own (plan: ~/.claude/plans/wetowl-stage-rust.md)"

[dependencies]
winit = "0.30.13"
wo-render = { path = "../../crates/wo-render" }
wo-show = { path = "../../crates/wo-show" }
wo-dance = { path = "../../crates/wo-dance" }
wo-wire = { path = "../../crates/wo-wire" }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_json = "1.0.154"
wo-milk = { path = "../../crates/wo-milk" }
image = { version = "0.25", default-features = false, features = ["png"] }
