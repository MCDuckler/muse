# 8G of heap plus the four gen_snapshot processes a release APK compiles in parallel
# is more than this machine has, and the kernel kills whichever it reaches first —
# twice in a row it was the build itself, half way through. Gradle never needed the
# eight: the release build peaks under two.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
