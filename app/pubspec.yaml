name: muse
description: Private music streaming client.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <5.0.0"

dependencies:
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  # Named directly so the app can say which audio platform is actually installed —
  # the difference between "playing in the background" and "playing until the system
  # notices nothing is holding this app up".
  just_audio_platform_interface: ^4.6.0
  just_audio_background: ^0.0.1-beta.17
  # Named directly so the app can ask the media session whether it is actually
  # running — the one question the logs could not answer.
  audio_service: ^0.18.19
  # Interruptions — a call, a notification, headphones pulled out — are the other
  # half of "playback stopped and nothing said why".
  audio_session: ^0.2.4
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  # The browser's own document, for the one thing Flutter cannot reach: the colour the
  # system paints the strips it draws around an installed app.
  web: ^1.1.0
  path_provider: ^2.1.6
  # Annotations only, in the code the windowless helpers share with the app.
  meta: any
  just_audio_media_kit: ^2.1.0
  # Named directly for the booth, which sets mpv's own audio filters on a deck.
  media_kit: ^1.2.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  # A Mac's libmpv, with the booth's filters: see dependency_overrides.
  media_kit_libs_macos_audio: ^1.1.4
  desktop_drop: ^0.8.4
  # The separator (bin/wetowl_separate.dart) talks to ONNX Runtime's C API directly,
  # and the model it runs is checked against a pinned hash when it is fetched.
  ffi: ^2.1.0
  crypto: ^3.0.0
  window_manager: ^0.5.2
  # The booth's decks on an iPhone and an iPad: see dependency_overrides.
  media_kit_libs_ios_audio: ^1.1.4
  # The icon in a desk's tray: see lib/src/ui/tray.dart and dependency_overrides.
  tray_manager: ^0.5.0
  flutter_midi_command: ^1.3.0
  # Wi-Fi or a phone's data: whether a song may come through this phone's own
  # connection (lib/src/worker/door_here_io.dart).
  connectivity_plus: ^7.3.1
# just_audio with one addition: an equalizer for iOS, which has to be attached where the
# player item is made — inside the plugin. See third_party/just_audio/WETOWL.md.
dependency_overrides:
  just_audio:
    path: third_party/just_audio
  # And the desktop engine with two accessors, so the booth can set mpv's own audio
  # filters on a deck. See third_party/just_audio_media_kit/WETOWL.md.
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  # And the background plugin, which refuses a second player — the booth is two.
  # See third_party/just_audio_background/WETOWL.md.
  just_audio_background:
    path: third_party/just_audio_background
  # The iOS libmpv with the filters a booth deck is made of, rather than the two the
  # default one has. See third_party/media_kit_libs_ios_audio/WETOWL.md.
  media_kit_libs_ios_audio:
    path: third_party/media_kit_libs_ios_audio
  # And the tray icon, with AppIndicator loaded when the tray is asked for rather than
  # linked: a Linux without it runs WetOwl with no icon instead of not at all. See
  # third_party/tray_manager/WETOWL.md.
  tray_manager:
    path: third_party/tray_manager
  # The same for a Mac. See third_party/media_kit_libs_macos_audio/WETOWL.md.
  media_kit_libs_macos_audio:
    path: third_party/media_kit_libs_macos_audio

dev_dependencies:
  # The fake audio engine in test/ implements this, so the player's own logic can be
  # tested without a browser or a device.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # integration_test/booth_perf_test.dart samples the UI isolate's CPU while the booth
  # plays, to say what keeps its frames from starting on time.
  vm_service: ^15.0.0
  # test/controller_linux_midi_test.dart registers the Linux MIDI backend by hand,
  # which `flutter test` does not do for it.
  flutter_midi_command_linux: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/brand/
    # The tray icon on a desk: a white stencil for Linux's panel (deploy/bake_icon.py),
    # the app's own .ico for Windows's.
    - assets/tray/
    # DJ controller layouts: one JSON per device per protocol. See docs/dj-controllers.md.
    - assets/controllers/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # The magazine's faces, cut down to Latin (German included) and to the weights the
    # design uses, so the web app does not load a megabyte of glyphs nobody sees.
    # Archivo keeps its width axis: extra condensed headlines and expanded flags are
    # the same font. See lib/src/ui/mag.dart.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/PermanentMarker.ttf
